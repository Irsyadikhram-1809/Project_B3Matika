    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="format-detection" content="telephone=no" />
    <!-- Open Graph -->
    <meta property="og:title" content="B3Matika — Belajar, Berlatih, Bermain" />
    <meta property="og:description" content="Platform belajar matematika interaktif untuk SD, SMP, hingga SMA/SMK." />

    <link rel="icon" type="image/jpeg" href="/logo-b3.jpeg" />
    <link rel="apple-touch-icon" href="/logo-b3.jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('admin-theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
        // Daftarkan Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/resources/js/main.jsx"></script>
  </body>
</html>
